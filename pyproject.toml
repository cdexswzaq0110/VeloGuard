[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "veloguard"
version = "1.0.0"
description = "Uncertainty-aware bike-share forecasting and rebalancing decision support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<2.5",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "pyarrow>=15,<24",
  "joblib>=1.3,<2",
  "fastapi>=0.110,<1",
  "uvicorn>=0.30,<1"
]

[project.scripts]
veloguard = "veloguard.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
